# Add one active feed entry per line (opkg format).
# Entries are prepended to the downloaded ImageBuilder repositories.conf before `make image`.
#
# Available variables:
#   ${PACKAGES_ARCH}
#   ${OPENWRT_VERSION}
#   ${BIG_VERSION}
#   ${DISTRIB_ARCH}
#   ${DISTRIB_RELEASE}
#
# Review third-party feed availability and signatures before enabling any entries.
#
# Example placeholders to review manually before use:
# src/gz passwall_packages https://example.com/releases/packages-${BIG_VERSION}/${PACKAGES_ARCH}/passwall_packages
# src/gz passwall_luci https://example.com/releases/packages-${BIG_VERSION}/${PACKAGES_ARCH}/passwall_luci
# src/gz openwrt_kenzok8 https://example.com/packages/${PACKAGES_ARCH}
src/gz mywrt https://mywrt.awayfrom.cn/packages-${BIG_VERSION}/${PACKAGES_ARCH}/mywrt